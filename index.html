<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泉州奶龙大学</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #1a5dc8 0%, #2b7de9 55%, #6fb3ff 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }
  header {
    font-size: 15px;
    letter-spacing: 2px;
    opacity: .85;
    margin-bottom: 28px;
  }
  .logo-wrap {
    position: relative;
    width: 260px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }
  .logo-wrap::before {
    content: "";
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    border: 2px dashed rgba(255,255,255,.45);
    animation: spin 14s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .logo-wrap img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
    animation: float 3.5s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  h1 {
    font-size: 42px;
    letter-spacing: 6px;
    text-shadow: 0 4px 14px rgba(0,0,0,.3);
    margin-bottom: 14px;
  }
  .sub { font-size: 16px; opacity: .9; margin-bottom: 34px; }
  .sub strong { color: #ffe27a; }
  .go-btn {
    display: inline-block;
    background: #ffe27a;
    color: #14509e;
    font-size: 20px;
    font-weight: 700;
    padding: 16px 64px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
    transition: transform .2s, box-shadow .2s;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .go-btn:hover { transform: scale(1.06); box-shadow: 0 12px 32px rgba(0,0,0,.35); }
  @keyframes pulse {
    0%,100% { box-shadow: 0 8px 24px rgba(0,0,0,.28); }
    50% { box-shadow: 0 8px 34px rgba(255,226,122,.65); }
  }
  .campus-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px;
    width: 100%;
    max-width: 900px;
    margin-top: 56px;
  }
  .campus {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 16px;
    padding: 22px 16px;
    text-align: center;
    text-decoration: none;
    color: #fff;
    backdrop-filter: blur(4px);
    transition: transform .2s, background .2s;
  }
  .campus:hover { transform: translateY(-6px); background: rgba(255,255,255,.22); }
  .campus .icon { font-size: 36px; display: block; margin-bottom: 10px; }
  .campus strong { color: #ffe27a; }
  .about {
    max-width: 720px;
    margin-top: 60px;
    background: rgba(0,0,0,.18);
    border-radius: 16px;
    padding: 28px 32px;
    font-size: 14px;
    line-height: 1.9;
    opacity: .95;
  }
  .about h2 { font-size: 18px; margin-bottom: 12px; letter-spacing: 2px; }
  footer { margin-top: 40px; font-size: 12px; opacity: .6; }
</style>
</head>
<body>
  <header>QUANZHOU NAILONG UNIVERSITY · EST. 2025</header>

  <div class="logo-wrap">
    <img src="logo.jpg" alt="泉州奶龙大学校徽">
  </div>

  <h1>泉州奶龙大学</h1>
  <p class="sub">奶龙正在护送你前往 <strong>泉州奶龙大学</strong></p>

  <a class="go-btn" href="https://qvtu.edu.cn/">立即前往</a>

  <div class="campus-list">
    <a class="campus" href="https://qvtu.edu.cn/">
      <span class="icon">🏫</span>泉州奶龙大学<strong>主校区</strong>
    </a>
    <a class="campus" href="https://qvtu.edu.cn/">
      <span class="icon">📚</span>泉州奶龙大学<strong>图书馆</strong>
    </a>
    <a class="campus" href="https://qvtu.edu.cn/">
      <span class="icon">🐉</span>泉州奶龙大学<strong>奶龙研究院</strong>
    </a>
    <a class="campus" href="https://qvtu.edu.cn/">
      <span class="icon">🎓</span>泉州奶龙大学<strong>招生办</strong>
    </a>
  </div>

  <div class="about">
    <h2>关于本站</h2>
    <p>本站为奶龙趣味站点，点击「立即前往」或任意校区卡片将跳转至泉州职业技术大学官网（qvtu.edu.cn）。</p>
    <p><strong>免责声明</strong>：本站纯属娱乐，与泉州职业技术大学及任何官方机构均无关联；「奶龙」形象版权归原权利方所有。</p>
    <p>请同学们注意甄别信息，谨防财产损失。</p>
  </div>

  <footer>© 2025 泉州奶龙大学 · 仅供娱乐</footer>

  <script>

    // setTimeout(function(){ location.href = "https://qvtu.edu.cn/"; }, 5000);
  </script>
</body>
</html>
